<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITI Student Document System</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 900px;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    text-align: center;
}

.header-image {
    width: 100%;
    max-width: 850px;
    height: auto;
    margin-bottom: 25px;
}

h1 {
    margin: 10px 0;
    font-size: 30px;
    color: #222;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 17px;
}

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.option {
    text-decoration: none;
    padding: 35px 20px;
    border-radius: 15px;
    border: 1px solid #ddd;
    background: #fafafa;
    transition: 0.25s;
    color: #222;
}

.option:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    background: white;
}

.icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.option h2 {
    margin: 10px 0;
    font-size: 23px;
}

.option p {
    color: #666;
    font-size: 15px;
    line-height: 1.5;
}

.attendance {
    border-top: 5px solid #d9534f;
}

.bonafide {
    border-top: 5px solid #337ab7;
}

.footer {
    margin-top: 30px;
    font-size: 13px;
    color: #777;
}


/* Mobile */

@media(max-width: 650px) {

    .container {
        padding: 20px;
    }

    h1 {
        font-size: 24px;
    }

    .options {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .option {
        padding: 25px 15px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- Institute Header -->
    <img src="header.png"
         class="header-image"
         alt="Institute Header">

    <h1>Student Document System</h1>

    <div class="subtitle">
        कृपया आवश्यक सेवा का चयन करें
    </div>


    <div class="options">

        <!-- Attendance Warning -->
        <a href="attendance.html" class="option attendance">

            <div class="icon">📋</div>

            <h2>
                Attendance Warning Letter
            </h2>

            <p>
                प्रशिक्षणार्थी की कम उपस्थिति के लिए
                चेतावनी पत्र तैयार करें।
            </p>

        </a>


        <!-- Bonafide Certificate -->
        <a href="bonafide.html" class="option bonafide">

            <div class="icon">📄</div>

            <h2>
                Bonafide Certificate
            </h2>

            <p>
                प्रशिक्षणार्थी का Bonafide Certificate
                तैयार एवं प्रिंट करें।
            </p>

        </a>

    </div>


    <div class="footer">
        Government ITI Maharajganj, Siwan
    </div>

</div>

</body>
</html>
